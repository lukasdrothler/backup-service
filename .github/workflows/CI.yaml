name: Docker Image CI for GHCR

on:
  push

jobs:
  sast-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit SAST scan
        run: |
          bandit -c bandit.yaml -r .
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/backup-service:latest -t ghcr.io/${{ github.repository_owner }}/backup-service:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository_owner }}/backup-service:latest
          docker push ghcr.io/${{ github.repository_owner }}/backup-service:${{ github.sha }}

  update-flux:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Flux Repository
        uses: actions/checkout@v3
        with:
          repository: lukasdrothler/k8s-flux
          token: ${{ secrets.GITOPS_PAT }}
          path: apps/base

      - name: Update Image Tag
        run: |
          # Navigate to the directory containing kustomization.yaml
          cd apps/base
          
          # Update the image tag using sed
          sed -i '/name: ghcr.io\/lukasdrothler\/backup-service/,/newTag:/ s|newTag: .*|newTag: ${{ github.sha }}|' apps/base/kustomization.yaml
      - name: Commit and Push Changes
        run: |
          cd apps/base
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes before committing
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "update: backup-service image tag to ${{ github.sha }}"
            git push
          else
            echo "No changes to commit"
          fi